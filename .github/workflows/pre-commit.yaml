name: pre-commit

on:
  pull_request:
    branches: [dev, main]

jobs:
  pre-commit:
    # Python 3.8 is unavailable on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: '3.8'
    - uses: pre-commit/action@v3.0.0
